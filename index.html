/* ================= Render ================= */
const SCREEN_NAMES={store:'店家頁',cart:'購物車步驟一',step2:'購物車步驟二',done:'訂單已送出',record:'訂購紀錄頁',cartlist:'購物車列表'};
function ensureMe(){
  if(isGroup() && !S.carts[meId()]){ const f=seedCarts(); S.carts[meId()]=f[meId()]; }
}
function render(){
  ensureMe();
  const phone=document.getElementById('phone');
  const keep={}; phone.querySelectorAll('[data-keep]').forEach(e=>keep[e.dataset.keep]=[e.scrollTop,e.scrollLeft]);
  const prevScroll = phone.querySelector('.scroll')?.scrollTop||0;
  const roleName = ROLES.find(r=>r[0]===S.role)[1];
  document.getElementById('screenName').textContent = `${SCREEN_NAMES[S.screen]}｜${roleName}`;
  let h = S.screen==='cart'?renderCart():S.screen==='step2'?renderStep2():S.screen==='done'?renderDone():S.screen==='record'?renderRecord():S.screen==='cartlist'?renderCartList():renderStore();
  h += sheetHTML() + dialogHTML();
  if(S.toast) h += `<div class="msg${S.toast.type==='error'?' error':''}" role="status" aria-live="polite">${S.toast.text}</div>`;
  phone.innerHTML = h;
  phone.classList.toggle('hide-annot',!S.annot);
  { const sc0=phone.querySelector('.scroll'), bb0=phone.querySelector('.bottom-bar'); if(sc0&&bb0) sc0.style.paddingBottom=Math.max(96,bb0.offsetHeight+24)+'px'; } // 底部固定列較高時（如步驟二），內容最後一段不被遮住
  phone.querySelectorAll('[data-keep]').forEach(e=>{ const k=keep[e.dataset.keep]; if(k!=null){ e.scrollTop=k[0]; e.scrollLeft=k[1]; } });
  if(S._chipScroll){ // 從月曆選日期後：日期列捲到選取的日期（Figma：回到選單，該日期呈 selected）
    const row=phone.querySelector('.date-row'), chip=row&&row.querySelector('.date-chip.on'), pin=row&&row.querySelector('.cal-pin');
    if(row&&chip&&pin){ const over=chip.offsetLeft+chip.offsetWidth-(row.scrollLeft+row.clientWidth), under=chip.offsetLeft-pin.offsetWidth-row.scrollLeft; if(over>0) row.scrollLeft+=over+16; else if(under<0) row.scrollLeft+=under; }
    S._chipScroll=null;
  }
  if(S._timeScroll){ // 換日期或開啟選擇器後：時間清單捲到已選時間
    const tl=phone.querySelector('.time-list'), on=tl&&tl.querySelector('.time-opt.on');
    if(tl&&on) tl.scrollTop=on.offsetTop-tl.offsetTop-88;
    S._timeScroll=false;
  }
  const sc=phone.querySelector('.scroll'); if(sc && S._keepScroll) sc.scrollTop=prevScroll;
  S._keepScroll=true;
  document.getElementById('ctlPanel').innerHTML = renderControls();
  document.getElementById('notePanel').innerHTML = renderNotes();
  const f=S._focus; if(f){ const el=document.getElementById(f); if(el){el.focus(); const v=el.value; el.setSelectionRange?.(v.length,v.length);} S._focus=null; }
}
function go(screen){ S.screen=screen; S._keepScroll=false; }

/* ================= Actions ================= */
function guardSync(){ // 下次操作時重取
  if(S.pendingLock && !isLeader()){ S.pendingLock=false; S.status='locked'; S.dialog='syncLocked'; S.sheet=null; return true; }
  return false;
}
function nameField(id,val,touched,help,label){ const bad=touched&&!val.trim();
  return `<div class="field">${label?`<label class="field-label" for="${id}">${label}</label>`:''}<input class="input${bad?' err':''}" id="${id}" maxlength="50" placeholder="請輸入你的名字" value="${esc(val)}">${bad?'<span class="field-err">請輸入你的名字</span>':`<span class="field-help">${help}</span>`}</div>`; }
function openForm(kind,focus){
  const g=S.group;
  const form = kind==='create'
    ? (()=>{ const st=S.store, ty=(st.type==='外送')?'自取':st.type; const t=pickupTimes(0)[0]; const dd = ty==='宅配'?DELIVERY_FROM:0; const f={name:S.noName?'專屬的限時團購':'王小明的限時團購',lname:'',type:ty,date:dd,time:ty==='宅配'?CLOSE:t,limitOn:false,limitVal:'',dDate:0,dTime:Math.ceil((NOW+10)/5)*5}; clampDeadline(f); return f; })()
    : {name:g.name,type:g.type,date:g.date,time:g.time,limitOn:!!g.limit,limitVal:g.limit?String(g.limit):'',dDate:g.dDate,dTime:g.dTime};
  S.sheet=kind; S.sh={form,noName:kind==='create'&&!!S.noName,view:'main',deadlineTouched:false,pickupTouched:false};
  if(focus==='pickup'){ S.sh.view='pickup'; S.sh.tmp={type:form.type,dine:'預約訂餐',date:form.date,time:(form.type==='宅配'||pickupTimes(form.date).includes(form.time))?form.time:pickupTimes(form.date)[0]}; }
  if(focus==='deadline'){ S.sh.view='deadline'; S.sh.tmp={dDate:form.dDate,dTime:form.dTime}; dlAutoPick(); }
}
function commitGeneral(clear){
  const f=S.sh.form;
  Object.assign(S.group,{name:f.name.trim(),type:f.type,date:f.date,time:f.time,limit:f.limitOn?Number(f.limitVal):0});
  if(S.sh.pickupTouched){ S.pickupInvalid=false; S.pickupPast=false; }
  if(clear){ for(const c of Object.values(S.carts)) c.items=[]; }
  S.dialog=null; S.sh.pickupTouched=false;
  toast(clear?'已儲存團購設定，購物車已清空':'已儲存團購設定');
}
function commitDeadline(){
  const f=S.sh.form;
  Object.assign(S.group,{dDate:f.dDate,dTime:f.dTime});
  if(S.status==='closed') S.status='open'; if(S.status==='lockedPast') S.status='locked';
  S.sh.deadlineTouched=false;
  toast('已儲存截止時間');
}
function commitEdit(clear){
  const f=S.sh.form;
  Object.assign(S.group,{name:f.name.trim(),type:f.type,date:f.date,time:f.time,limit:f.limitOn?Number(f.limitVal):0,dDate:f.dDate,dTime:f.dTime});
  if(S.sh.deadlineTouched){ if(S.status==='closed') S.status='open'; if(S.status==='lockedPast') S.status='locked'; }
  if(S.sh.pickupTouched){ S.pickupInvalid=false; S.pickupPast=false; }
  if(clear){ for(const c of Object.values(S.carts)) c.items=[]; }
  S.sheet=null; S.dialog=null;
  toast(clear?'已更新團購資訊，購物車已清空':'已更新團購資訊');
}

const A = {
  noop(){}, stop(){},
  q(el){ const id=el.dataset.q; const n=document.getElementById('note-'+id); if(n){ n.scrollIntoView({block:'center',behavior:'smooth'}); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash'); } return 'norender'; },
  setRole(el){ S.role=el.dataset.v; S.dialog=null; S.sheet=null; if(S.screen==='cartlist'){} else if(!isGroup()||(S.screen!=='store'&&!(S.screen==='cart'))) go('store'); if(S.screen==='step2'&&!isLeader()) go('store'); },
  setStatus(el){ S.status=el.dataset.v; },
  setLimit(el){ S.group.limit=Number(el.dataset.v); },
  setScreen(el){ if(el.dataset.v==='record'){ A.snapOrder(); S.recOpen=false; } go(el.dataset.v); S.dialog=null; S.sheet=null; if(el.dataset.v==='step2' && !isLocked()) S.status='locked'; },
  toggleAnnot(){ S.annot=!S.annot; },
  toggleMenuChanged(){ S.menuChanged=!S.menuChanged; },
  reset(){ S.noName=false; S.clearedNotice=false; S.pickupPast=false; S.carts=seedCarts(); S.group=defaultGroup(); S.status='open'; S.pickupInvalid=false; S.pendingLock=false; S.normalCart=[]; S.dialog=null; S.sheet=null; S.collapsed={}; go('store'); },
  startGroup(){
    if(S.role==='guest'){ toast('（原型）前往會員登入／註冊頁，完成後回到店家頁'); return; }
    if(S.role==='blacklist'){ S.dialog='blacklist'; return; }
    openForm('create');
  },
  closeDialog(){ S.dialog=null; },
  closeSheet(){ S.sheet=null; },
  sheetView(el){ const v=el.dataset.v, f=S.sh.form; S.sh.view=v; S.sh.tmp = v==='pickup'?{type:f.type,date:f.date,time:f.time,dine:'預約訂餐'}:{dDate:f.dDate,dTime:f.dTime}; if(v==='deadline') dlAutoPick(); if(v==='pickup'&&f.type!=='宅配'&&!pickupTimes(f.date).includes(f.time)) S.sh.tmp.time=pickupTimes(f.date)[0]; if(v==='deadline'&&!deadlineValid(f)){ const t={...f}; clampDeadline(t); S.sh.tmp={dDate:t.dDate,dTime:t.dTime}; } S._timeScroll=true; S._chipScroll=v; },
  sheetBack(){ S.sh.view='main'; },
  tmpDate(el){ const i=Number(el.dataset.i), t=S.sh.tmp, grp=S.sheet!=='storePickup'; t.date=i; if(t.type!=='宅配'){ t.time=(grp?pickupTimes(i):storeTimes(i))[0]; if(!grp) t.asap=(i===0&&t.type==='自取'); } S._timeScroll=true; },
  tmpTime(el){ S.sh.tmp.time=Number(el.dataset.m); S.sh.tmp.asap=false; },
  pkAsap(){ S.sh.tmp.asap=true; },
  pkDine(el){ S.sh.tmp.dine=el.dataset.v; },
  setAddr(){ toast('（原型）地址設定沿用現行流程，此處未實作'); },
  pkType(el){ const t=S.sh.tmp, grp=S.sheet!=='storePickup', was=t.type; t.type=el.dataset.v; const ds=pkDates(t,grp); if(!ds.includes(t.date)||was==='宅配') t.date=ds[0]??0; if(t.type==='宅配') t.time=CLOSE; else { const l=grp?pickupTimes(t.date):storeTimes(t.date); if(!l.includes(t.time)||was==='宅配') t.time=l[0]; if(!grp) t.asap=(t.type==='自取'&&t.date===0); } S._chipScroll='pickup'; S._timeScroll=true; },
  openStorePickup(){ const st=S.store; S.sheet='storePickup'; S.sh={tmp:{...st,time:st.time??storeTimes(st.date)[0]}}; S._chipScroll='pickup'; S._timeScroll=true; },
  confirmStorePickup(){ if(!pkCanConfirm()) return; S.store={...S.sh.tmp}; S.sheet=null; },
  storeType(el){ const v=el.dataset.v, st=S.store; if(v==='外送'){ A.openStorePickup(); A.pkType(el); return; } const was=st.type; st.type=v; const ds=pkDates(st,false); if(!ds.includes(st.date)||was==='宅配') st.date=ds[0]; if(v==='宅配'){ st.asap=false; } else { st.time=storeTimes(st.date)[0]; st.asap=(v==='自取'&&st.date===0); if(v==='內用') st.dine='預約訂餐'; } },
  confirmPickup(){ if(!pkCanConfirm()) return; const f=S.sh.form; f.type=S.sh.tmp.type; f.date=S.sh.tmp.date; f.time=S.sh.tmp.type==='宅配'?CLOSE:S.sh.tmp.time; S.sh.pickupTouched=true; S.sh.view='main'; },
  tmpDDate(el){ const i=Number(el.dataset.i); S.sh.tmp.dDate=i; const l=deadlineTimes(i,S.sh.form); if(!l.includes(S.sh.tmp.dTime)) S.sh.tmp.dTime=l[0]; S._timeScroll=true; },
  openCal(el){ const kind=el.dataset.for, sel=kind==='pickup'?S.sh.tmp.date:S.sh.tmp.dDate, d=DATES[sel]||DATES[selectableDates(kind)[0]]; S.sh.cal={for:kind,y:d.y,m:d.m}; },
  closeCal(){ S.sh.cal=null; },
  calNav(el){ const c=S.sh.cal, t=new Date(c.y,c.m+Number(el.dataset.dm),1); c.y=t.getFullYear(); c.m=t.getMonth(); },
  calPick(el){ const i=Number(el.dataset.i), kind=S.sh.cal.for; if(kind==='pickup') A.tmpDate(el); else A.tmpDDate(el); S.sh.cal=null; S._chipScroll=kind; },
  tmpDTime(el){ S.sh.tmp.dTime=Number(el.dataset.m); },
  confirmDeadline(){ const f=S.sh.form; f.dDate=S.sh.tmp.dDate; f.dTime=S.sh.tmp.dTime; S.sh.deadlineTouched=true; S.sh.view='main'; },
  limitOn(el){ S.sh.form.limitOn = el.dataset.v==='1'; if(S.sh.form.limitOn) S._focus='glimit'; },
  createGroup(){
    const f=S.sh.form;
    S.group={name:f.name.trim(),type:f.type,date:f.date,time:f.time,limit:f.limitOn?Number(f.limitVal):0,dDate:f.dDate,dTime:f.dTime};
    const fresh=seedCarts(); S.carts={lead:{...fresh.lead,items:[]}}; if(S.sh.noName) S.carts.lead.name=f.lname.trim(); S.noName=false;
    S.role='leader'; S.status='open'; S.sheet=null; S.dialog='share'; go('store');
  },
  openEdit(el){ if(isLocked() && !el.dataset.focus) return; openForm('edit',el.dataset.focus); },
  openEditFromDlg(){ S.dialog=null; openForm('edit','pickup'); },
  saveGeneral(){ if(S.menuChanged && S.sh.pickupTouched){ S.dialog='menuChanged'; return; } commitGeneral(false); },
  saveDeadline(){ commitDeadline(); },
  saveEdit(){ if(S.menuChanged && (S.sh.pickupTouched)){ S.dialog='menuChanged'; return; } commitEdit(false); },
  saveEditConfirmed(){ if(S.sheet==='edit') commitGeneral(true); else commitEdit(true); },
  askCancelGroup(){ S.dialog='cancelGroup'; },
  doCancelGroup(){ S.sheet=null; S.dialog=null; S.role='member'; S.carts=seedCarts(); S.group=defaultGroup(); S.status='open'; go('store'); toast('已取消團購'); },
  openShare(){ S.dialog='share'; },
  copyLink(){ S.dialog=null; toast('已複製團購連結'); },
  openInfo(){ if(guardSync()) return; S.dialog='info'; },
  askExit(){ S.dialog='exit'; },
  doExit(){ S.dialog=null; S.role='member'; go('store'); toast('已退出團購'); },
  goCart(){ if(guardSync()) return; go('cart'); },
  goStore(){ go('store'); },
  goStep2(){ S.status = isPast()?'lockedPast':'locked'; go('step2'); toast('已鎖定團購，團員暫時無法修改品項'); },
  snapOrder(){ const l=memberList().filter(c=>c.items.length); const t=l.reduce((a,c)=>a+subtotal(c),0); S.doneTotal=t+Math.round(t*0.1); S.doneCarts=l.map(c=>({id:c.id,name:c.id===meId()?c.name+'（團長）':c.name,lead:c.id===meId(),items:c.items.map(x=>({...x}))})); S.paid=S.paid||{}; },
  submitOrder(){ const l=memberList().filter(c=>c.items.length); const t=l.reduce((a,c)=>a+subtotal(c),0); S.doneTotal=t+Math.round(t*0.1); S.doneCarts=l.map(c=>({id:c.id,name:c.id===meId()?c.name+'（團長）':c.name,lead:c.id===meId(),items:c.items.map(x=>({...x}))})); S.paid={}; S.dialog=null; go('done'); },
  togglePaid(el){ const id=el.dataset.id; S.paid[id]=!S.paid[id]; },
  goRecord(){ S.recOpen=false; go('record'); },
  toggleRec(){ S.recOpen=!S.recOpen; },
  afterSubmit(){ S.dialog=null; S.role='member'; S.carts=seedCarts(); S.group=defaultGroup(); S.status='open'; go('store'); toast('團購已結束，回到一般身份'); },
  toggleCart(el,ev){ if(ev.target.closest('button')) return 'norender'; const id=el.dataset.id; S.collapsed[id]=!S.collapsed[id]; },
  askRemove(el){ S.dlg={id:el.dataset.id}; S.dialog='remove'; },
  doRemove(){ const c=S.carts[S.dlg.id]; delete S.carts[S.dlg.id]; S.dialog=null; toast(`已將${c.name}移出團購`); },
  askUnlock(){ S.dialog='unlock'; },
  doUnlock(){ if(S.status==='lockedPast'){ S.status='closed'; S.dialog='unlockPast'; } else { S.status='open'; S.dialog=null; toast('已解除鎖定'); } },
  unlockEdit(){ S.dialog=null; openForm('edit','deadline'); },
  inc(el){
    if(guardSync()) return;
    const c=S.carts[el.dataset.id], x=c.items.find(i=>i.uid===el.dataset.uid);
    if(S.group.limit && !c.lead && subtotal(c)+MENU[x.mid].price>S.group.limit){ toast(`${c.id===meId()?'你':c.name}加點後會超過每人上限 ${money(S.group.limit)}，無法再加點`,'error'); return; }
    x.qty++;
  },
  dec(el){
    if(guardSync()) return;
    const c=S.carts[el.dataset.id], i=c.items.findIndex(i=>i.uid===el.dataset.uid);
    if(c.items[i].qty>1) c.items[i].qty--; else c.items.splice(i,1);
  },
  follow(el){ if(guardSync()) return; S.sheet='item'; S.sh={mid:el.dataset.mid,sel:null,qty:1,follow:true}; },
  openItem(el){ if(guardSync()) return; S.sheet='item'; S.sh={mid:el.dataset.mid,sel:null,qty:1,follow:false}; },
  pickOpt(el){ S.sh.sel=el.dataset.v; },
  sheetQty(el){ S.sh.qty=Math.max(1,S.sh.qty+Number(el.dataset.d)); },
  addItem(){ S.clearedNotice=false;
    const {mid,sel,qty}=S.sh, note=(S.sh.note||'').trim(), opts=note?`${sel}, ${note}`:sel;
    if(isGroup()){ me().items.push(it(mid,qty,opts)); } else { S.normalCart.push(it(mid,qty,opts)); }
    S.sheet=null; toast('已加入購物車');
  },
  // 連結進入
  linkValid(el){ // 模擬一個還沒有團購身份的人點開連結（同店已在其他團的情境請用「同店已參加其他團」）
    S.role = el.dataset.v==='member' ? 'member' : 'guest'; S.status='open'; S.sheet=null;
    S.dlg={loggedIn:S.role==='member',who:'visitor',vname:''}; S.dialog='identity'; go('store');
  },
  cancelMenuChange(){ /* 規格：取消 → 留在原視窗，不儲存，設定值還原 */ const f=S.sh.form, g=S.group; Object.assign(f,{type:g.type,date:g.date,time:g.time}); S.sh.pickupTouched=false; S.dialog=null; render(); },
  linkNoName(){ S.role='member'; S.status='open'; S.sheet=null; S.carts.mei.name='小美'; S.dlg={loggedIn:true,noName:true,who:'visitor',vname:'',mname:''}; S.dialog='identity'; go('store'); },
  createNoName(){ S.role='member'; S.noName=true; S.dialog=null; go('store'); openForm('create'); },
  linkClosed(){ S.dlg={locked:false}; S.dialog='linkClosed'; },
  linkLocked(){ S.dlg={locked:true}; S.dialog='linkClosed'; },
  linkInvalid(){ S.dialog='linkInvalid'; },
  linkOther(){ if(!isGroup()) S.role='gm'; S.dlg={asLeader:isLeader()}; S.dialog='linkOther'; },
  toStoreNormal(){ if(isGroup()) S.role='member'; S.dialog=null; go('store'); },
  backToMyGroup(){ S.dialog=null; go('store'); },
  pickWho(el){ S.dlg.who=el.dataset.v; if(S.dlg.who==='visitor') S._focus='vname'; },
  joinGroup(){
    if(!S.dlg.loggedIn && S.dlg.who==='member'){ toast('（原型）前往登入，完成後回到店家頁（參加團購模式）'); S.dlg.loggedIn=true; return; }
    if(S.dlg.loggedIn){ S.role='gm'; if(S.dlg.noName) S.carts.mei.name=S.dlg.mname.trim(); } else { S.role='gv'; S.carts.zhe = S.carts.zhe||{id:'zhe',visitor:true,joined:4,items:[]}; S.carts.zhe.name=S.dlg.vname.trim(); }
    S.status='open'; S.dialog=null; go('store'); toast('已加入團購');
  },
  joinLater(){ S.dialog=null; toast('以一般身份瀏覽店家'); },
  // 模擬
  simPickupPast(){ S.role='leader'; S.status='closed'; S.pickupPast=true; S.pickupInvalid=true; /* 取餐時間已過視同規格 3.2 失效：關閉修改視窗後進入「取餐方式／時間失效」團長 ② 失效頁（HungYu 同意，待 PM 確認） */ S.dialog=null; go('store'); openForm('edit'); toast('（模擬）取餐時間已過：需重選取餐時間；直接關閉會進入失效頁'); },
  simPickup(){ if(!isGroup()){ S.role='leader'; } S.pickupInvalid=true; go('store'); S.dialog='pickupInvalid'; },
  simStockOut(){ if(!isGroup()) S.role='leader'; S.status='open'; const rows=[];
    for(const c of memberList()){ const id=c.id; const gone=c.items.filter(x=>x.mid==='m3'); if(!gone.length) continue;
      rows.push({who:id===meId()?'我自己':c.name, items:gone.map(x=>`${MENU[x.mid].name}（${x.opts}）×${x.qty}`).join('、')}); c.items=c.items.filter(x=>x.mid!=='m3'); }
    if(!rows.length){ toast('（模擬）目前購物車沒有小農鮮奶茶，請先重置'); return; }
    S.dlg={rows}; S.sheet=null; S.dialog=isLeader()?'stockOut':null; /* 團員端不跳視窗，直接顯示移除後的購物車（PM 已確認） */ go('cart'); },
  stockPick(){ S.dialog=null; go('store'); },
  simCleared(){ if(isLeader()||!isGroup()) S.role='gm'; for(const c of Object.values(S.carts)) c.items=[]; S.group.time='13:30'; S.clearedNotice=true; S.dialog='cleared'; go('cart'); },
  simLimit(){ S.role='gm'; S.status='open'; const c=S.carts.mei; c.items=[it('m2',1,'原味, 加蜂蜜'),it('m3',1,'少冰, 微糖'),it('m1',1,'脆皮'),it('m5',1,'脆皮')]; S.group.limit=300; go('store'); },
  simPendingLock(){ if(isLeader()||!isGroup()) S.role='gm'; S.status='open'; S.pendingLock=true; go('cart'); toast('（模擬）團長已在背景鎖定，請試著按＋或－'); },
};

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='INPUT') return;
  const act=el.dataset.act;
  if(act==='stop') return;
  if(el.disabled) return;
  const fn=A[act]; if(!fn) return;
  const r=fn(el,ev);
  if(r!=='norender') render();
});
document.addEventListener('change',ev=>{
  const el=ev.target; if(el.tagName==='INPUT' && el.type==='checkbox' && el.dataset.act){ A[el.dataset.act](el); render(); }
});
function onField(el){
  if(el.id==='gname'){ S.sh.form.name=el.value; S._focus='gname'; render(); }
  if(el.id==='glimit'){ el.value=el.value.replace(/\D/g,''); S.sh.form.limitVal=el.value; S._focus='glimit'; render(); }
  if(el.id==='lname'){ S.sh.form.lname=el.value; if(el.value) S.sh.ltouched=true; S._focus='lname'; render(); }
  if(el.id==='mname'){ S.dlg.mname=el.value; if(el.value) S.dlg.mtouched=true; S._focus='mname'; render(); }
  if(el.id==='vname'){ S.dlg.vname=el.value; if(el.value) S.dlg.vtouched=true; S._focus='vname'; render(); }
  if(el.id==='inote'){ S.sh.note=el.value.replace(/#/g,'').slice(0,40); S._focus='inote'; render(); }
}
document.addEventListener('input',ev=>{ if(ev.isComposing) return; onField(ev.target); });
document.addEventListener('compositionend',ev=>onField(ev.target));
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape' && (S.sheet||S.dialog) && S.dialog!=='identity'){ S.sheet=null; S.dialog=null; render(); } });

/* 手機全螢幕展示模式：長按左上角（64×64）0.6 秒開啟控制面板；選完控制項自動收合 */
const MOBILE=matchMedia('(max-width:500px)');
if(MOBILE.matches) S.annot=false; // 展示時預設不顯示標註編號，維持設計稿原貌（可在面板裡打開）
function mOpen(tab){ document.body.classList.add('m-open'); document.body.classList.toggle('m-notes',tab==='notes'); document.getElementById('mTabCtl').setAttribute('aria-selected',tab!=='notes'); document.getElementById('mTabNotes').setAttribute('aria-selected',tab==='notes'); }
function mClose(){ document.body.classList.remove('m-open','m-notes'); }
document.getElementById('mTabCtl').onclick=()=>mOpen('ctl');
document.getElementById('mTabNotes').onclick=()=>mOpen('notes');
document.getElementById('mClose').onclick=mClose;
document.getElementById('mScrim').onclick=mClose;
let lpTimer=null, lpFired=false, lpSuppressUntil=0;
document.addEventListener('pointerdown',ev=>{
  if(!MOBILE.matches || document.body.classList.contains('m-open')) return;
  if(ev.clientX>64 || ev.clientY>64) return;
  lpFired=false; clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{ lpFired=true; if(navigator.vibrate) navigator.vibrate(15); mOpen('ctl'); },600);
});
['pointerup','pointercancel','pointermove'].forEach(t=>document.addEventListener(t,ev=>{ if(t==='pointermove' && Math.abs(ev.movementX)+Math.abs(ev.movementY)<4) return; clearTimeout(lpTimer); if(t!=='pointermove' && lpFired){ lpFired=false; lpSuppressUntil=Date.now()+500; } }));
document.addEventListener('click',ev=>{ if(Date.now()<lpSuppressUntil){ lpSuppressUntil=0; ev.stopImmediatePropagation(); ev.preventDefault(); } },true); // 只擋長按放開後 0.5 秒內的那一下點擊（iOS 長按後通常不會產生點擊，不能一直擋著）
document.addEventListener('contextmenu',ev=>{ if(MOBILE.matches && ev.clientX<=64 && ev.clientY<=64) ev.preventDefault(); });
document.addEventListener('click',ev=>{ if(MOBILE.matches && ev.target.closest('#ctlPanel [data-act]') && ev.target.tagName!=='INPUT') setTimeout(mClose,120); },true);
document.addEventListener('change',ev=>{ if(MOBILE.matches && ev.target.closest('#ctlPanel')) setTimeout(mClose,120); },true);

render();
</script>
